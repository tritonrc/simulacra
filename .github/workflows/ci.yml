name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Deny warnings, and drop debug info: the test binaries statically link the
  # whole workspace (wasmtime/cranelift included), and full debuginfo makes the
  # linker run out of memory on standard runners (ld "bus error").
  RUSTFLAGS: "-D warnings -C debuginfo=0"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      - name: Install Aniani
        run: >-
          cargo install --locked
          --git https://github.com/tritonrc/aniani.git
          --rev cfefdbf63971cde2385199fd9247ce2be615b699
          aniani
      - name: Start Aniani
        run: |
          aniani --port 4320 --retention 2h > "$RUNNER_TEMP/aniani.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/aniani.pid"
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4320/ready > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/aniani.pid")" 2> /dev/null; then
              cat "$RUNNER_TEMP/aniani.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/aniani.log"
          exit 1
      - name: Build workspace
        run: cargo build --workspace
      # nextest runs each test in its own process (isolation) and retries
      # transient flakes (see .config/nextest.toml). This handles the
      # timing-sensitive TUI suite and SQLite "database is locked" races that
      # the default in-process runner is prone to under CI load.
      - name: Test (nextest)
        run: cargo nextest run --workspace
      - name: Print Aniani logs on failure
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/aniani.log" ]]; then
            cat "$RUNNER_TEMP/aniani.log"
          fi
      - name: Stop Aniani
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/aniani.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/aniani.pid")" 2> /dev/null || true
          fi
